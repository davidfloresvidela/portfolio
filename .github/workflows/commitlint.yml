name: Commitlint

# Separate from ci.yml so push runs don't list a skipped job: commit ranges
# only exist on pull requests, so this workflow runs there and nowhere else.
on:
  pull_request:
    branches: [dev, main]

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
